[project]
name = "linz-stac-utils"
version = "0.1.0"
description = "Load public LINZ elevation data from the nz-elevation STAC catalog."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Quinn Hornblow", email = "quinn.hornblow@protonmail.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
]
keywords = ["elevation", "geospatial", "linz", "stac"]
dependencies = [
    "numpy>=1.24",
    "odc-geo>=0.5.1",
    "odc-stac>=0.5.2",
    "platformdirs>=4.9.4",
    "pystac>=1.14.3",
    "pystac-client>=0.9.0",
    "requests-cache>=1.3.1",
    "shapely>=2.1.2",
    "xarray>=2023.1",
]

[project.urls]
Homepage = "https://github.com/quinnhornblow/linz-stac-utils"
Issues = "https://github.com/quinnhornblow/linz-stac-utils/issues"
Repository = "https://github.com/quinnhornblow/linz-stac-utils"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-exclude = ["*.sqlite"]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "notebook>=7.5.5",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "ruff>=0.15.10",
]

[tool.deptry]
known_first_party = ["linz_stac_utils"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that exercise the live remote catalog",
]
